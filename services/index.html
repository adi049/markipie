<body class="page-services">
<a class="skip-link" href="#site">Skip to content</a>

<header id="siteHeader" class="site-header"></header>
<div id="mobileDrawer" class="drawer" hidden></div>

<main id="site" class="site-main">

  <section class="page-hero">
    <div class="container">
      <span class="eyebrow">Rate Card</span>
      <h1 class="h1">Photography &amp;<br>Cinematography Packages</h1>
      <p class="lead">Beautifully crafted wedding experiences, captured from every angle.</p>
    </div>
  </section>

  <!-- sticky filter tabs -->
  <nav class="cat-nav" id="catNav" aria-label="Package categories">
    <button class="cat-pill is-active" type="button" data-f="all" data-cat="all">All Packages</button>
    <button class="cat-pill" type="button" data-f="wedding" data-cat="wedding">Wedding</button>
    <button class="cat-pill" type="button" data-f="engagement" data-cat="engagement">Engagement</button>
    <button class="cat-pill" type="button" data-f="prewedding" data-cat="prewedding">Pre-Wedding</button>
    <button class="cat-pill" type="button" data-f="premium" data-cat="premium">Premium Collection</button>
  </nav>

  <div class="container" id="packagesRoot"><!-- package cards rendered from data --></div>

  <!-- compare bar -->
  <div class="cmp-bar" id="cmpBar">
    <span class="cmp-count" id="cmpCount">0 selected · pick up to 3</span>
    <span class="cmp-actions">
      <button class="btn btn--ghost btn--sm" id="cmpClear" type="button">Clear</button>
      <button class="btn btn--primary btn--sm" id="cmpRun" type="button" disabled>Compare Packages</button>
    </span>
  </div>

  <section class="section">
    <div class="container">
      <div class="cta-band reveal">
        <span class="eyebrow">Custom requirements?</span>
        <h2 class="h2">Tell us about your events</h2>
        <p>Dates, venues and the coverage you need — we'll recommend the right package.</p>
        <div class="hero-cta"><a class="btn btn--primary" href="/contact/">Enquire now</a></div>
      </div>
    </div>
  </section>

</main>

<div id="pkgModalEl" class="pm-backdrop" aria-live="polite"></div>

<footer id="siteFooter" class="site-footer"></footer>
<div id="fabs" class="fabs"></div>

<script src="/assets/js/services/servicePackageService.js"></script>
<script src="/assets/js/page-services.js"></script>
